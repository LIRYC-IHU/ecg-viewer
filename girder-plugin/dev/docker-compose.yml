# Local Girder 5 + MongoDB with the plugin installed (editable).
#
#   npm run build:girder                       # from the repository root
#   docker compose -p girder-ecg-viewer -f girder-plugin/dev/docker-compose.yml up --build -d
#   girder-plugin/dev/seed.sh
#
# Then open http://localhost:8089: seed.sh creates a dev admin and a public
# "ECG samples" collection (DICOM and FDA aECG files). The image includes the
# ecg-bridge converters, so vendor formats are converted on the fly.
services:
  mongodb:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db

  girder:
    build:
      # The whole repository: the tests use the sample ECGs in server/samples.
      context: ../..
      dockerfile: girder-plugin/dev/Dockerfile
    platform: linux/amd64
    depends_on:
      - mongodb
    ports:
      - "8089:8080"
    volumes:
      - ../..:/src/ecg-viewer
      - assetstore:/assetstore
    # The image entrypoint is `girder serve`.
    command: >
      --host 0.0.0.0 --database mongodb://mongodb:27017/girder

volumes:
  mongo-data:
  assetstore:
